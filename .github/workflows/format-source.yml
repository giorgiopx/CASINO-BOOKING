name: Check CasinoBooking source formatting
on:
  push:
    branches:
      - feature/restore-lovable-casinobooking
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check src package.json scripts/browser-smoke.mjs
