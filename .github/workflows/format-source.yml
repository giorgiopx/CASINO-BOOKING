name: Format and verify CasinoBooking source
on:
  push:
    branches:
      - feature/restore-lovable-casinobooking
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/restore-lovable-casinobooking
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Apply Prettier to project sources
        run: bunx prettier --write .
      - name: Fix remaining ESLint-formatted JSX
        run: bunx eslint src/components/casino/admin-details.tsx --fix
      - name: Save formatting on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub App token cannot update workflow definitions.
          git add -u -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to restored CasinoBooking source"
            git push origin HEAD:feature/restore-lovable-casinobooking
          fi
