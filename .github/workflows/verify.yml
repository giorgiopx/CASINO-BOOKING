name: Verify CasinoBooking
on:
  pull_request:
  push:
    branches:
      - feature/restore-lovable-casinobooking
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run lint
      - run: bun run test
