name: Verify CasinoBooking
on:
  pull_request:
  push:
    branches:
      - feature/restore-lovable-casinobooking
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun run lint
      - run: bun run test
      - name: Verify approved design images
        run: |
          test -f public/design-reference/hero-reference.webp
          for country in monaco cyprus greece italy france spain portugal serbia romania slovenia bulgaria croatia; do
            test -f "public/design-reference/$country.webp"
          done
