name: CasinoBooking build and tests
on:
  push:
    branches: ["feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and generate router types
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun run test
      - name: Lint
        run: bun run lint
