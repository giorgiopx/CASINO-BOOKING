name: CasinoBooking build and tests
on:
  push:
    branches: ['feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build and generate router types
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun run test
      - name: Normalize Lovable-generated formatting (CI workspace only)
        run: bunx prettier --write .
      - name: Normalize lint autofixable formatting (CI workspace only)
        run: bunx eslint . --fix
      - name: Lint
        run: bun run lint
