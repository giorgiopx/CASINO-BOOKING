name: CasinoBooking Chromium public-browser smoke
on:
  push:
    branches:
      - feature/restore-lovable-casinobooking
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Exercise the real unavailable-account state without inventing a backend.
      VITE_SUPABASE_URL: ""
      VITE_SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
      SMOKE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Chromium runner browser
        run: bunx --no-install playwright install chromium --with-deps
      - name: Start temporary local app
        shell: bash
        run: |
          (bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cb-vite.log 2>&1 &)
          for i in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cb-vite.log
          exit 1
      - name: Check responsive UI, language, navigation, forms, anonymous guards and approved photos
        run: node scripts/browser-smoke.mjs
      - name: Save QA screenshots and explicit public-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casinobooking-chromium-qa
          path: artifacts/browser-smoke/
          if-no-files-found: error
          retention-days: 7
      - name: Print temporary server errors
        if: failure()
        run: tail -100 /tmp/cb-vite.log || true
