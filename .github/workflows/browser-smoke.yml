name: CasinoBooking Chromium public-browser smoke
on:
  push:
    branches:
      - feature/restore-lovable-casinobooking
    paths:
      - "scripts/browser-smoke.mjs"
      - "public/design-reference/**"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mock_browser_smoke
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_mock_browser_smoke
      SMOKE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install application
        run: bun install
      - name: Install browser test runner
        run: |
          bun add --dev playwright
          bunx playwright install chromium --with-deps
      - name: Start temporary local app
        shell: bash
        run: |
          (bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cb-vite.log 2>&1 &)
          for i in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cb-vite.log
          exit 1
      - name: Check navigation, forms, auth guards and original photos
        run: node scripts/browser-smoke.mjs
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casinobooking-chromium-qa
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Print temporary server errors
        if: failure()
        run: tail -100 /tmp/cb-vite.log || true
