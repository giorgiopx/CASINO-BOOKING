name: Format approved CasinoBooking directory
on:
  push:
    branches:
      - feature/approved-15-country-directory-20261015
    paths:
      - .github/workflows/format-approved-directory.yml
permissions:
  contents: write
jobs:
  format-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/approved-15-country-directory-20261015
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Format new approved catalogue and modified pages
        run: |
          bunx prettier --write \
            src/lib/approved-casino-directory.ts \
            src/routes/casino-country.\$slug.tsx \
            src/routes/casino-country.css \
            src/routes/destinations.tsx \
            src/routes/approved-destinations.css \
            src/components/casino/visual-home.tsx \
            src/components/casino/visual-home.css \
            src/components/casino/request.tsx \
            src/lib/casino-request-schema.ts \
            src/test/approved-directory.test.ts
          bunx eslint --fix \
            src/lib/approved-casino-directory.ts \
            src/routes/casino-country.\$slug.tsx \
            src/routes/destinations.tsx \
            src/components/casino/visual-home.tsx \
            src/components/casino/request.tsx \
            src/lib/casino-request-schema.ts \
            src/test/approved-directory.test.ts
      - name: Commit formatting without modifying workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- src/
          if ! git diff --cached --quiet; then
            git commit -m "style: format approved directory and request pages"
            git push origin HEAD:feature/approved-15-country-directory-20261015
          fi
